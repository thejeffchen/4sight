[project]
name = "foresight"
version = "0.1.0"
description = "4sight AI backend - spreadsheet financial modeling assistant"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "websockets>=14.0",
    "anthropic>=0.42.0",
    "xlwings>=0.33.0",
    "sqlalchemy[asyncio]>=2.0",
    "pydantic>=2.0",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["foresight*"]
